[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subzero"
version = "0.1.0"
description = "Cold War acoustic submarine roguelike for the terminal"
requires-python = ">=3.9"

[project.scripts]
subzero = "subzero.__main__:main"

[tool.setuptools]
packages = ["subzero"]
